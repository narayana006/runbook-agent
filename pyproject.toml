[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-agent"
version = "0.1.0"
description = "Turn Markdown runbooks into steps: read-only diagnostics run automatically, changes require human approval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
runbook-agent = "runbook_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
