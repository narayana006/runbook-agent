name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Dry-run the example runbook
        run: runbook-agent run examples/runbooks/disk-full.md
      - name: Classify with custom rules
        run: runbook-agent parse examples/runbooks/gcp-vm.md --rules examples/rules.json
